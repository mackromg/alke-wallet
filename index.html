<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Inicio de sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container text-center">
        <div class="card mx-auto shadow-sm" style="max-width: 400px;">
            <div class="card-body p-4">
                <h2 class="mb-4">Inicio de sesión</h2>
                
                <!-- Contenedor para las alertas de Bootstrap que pide el profe -->
                <div id="alert-container"></div>

                <form id="loginForm">
                    <div class="mb-3 text-start">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3">Iniciar sesión</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Librería jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // usando jQuery para atrapar el formulario
        $('#loginForm').submit(function(e) {
            e.preventDefault(); 
            // capturo valores con .val() como pide la tarea
            let pass = $('#password').val();

            if (pass === '1234') {
                // Alerta de éxito con Bootstrap
                $('#alert-container').html('<div class="alert alert-success">¡Ingreso exitoso! Redirigiendo...</div>');
                // Redirijo al menú usando jQuery despues de medio segundo
                setTimeout(() => window.location.href = 'menu.html', 500);
            } else {
                // Alerta de error con Bootstrap
                $('#alert-container').html('<div class="alert alert-danger">Clave incorrecta. (Pista: [para efectos del curso, 1234]</div>');
            }
        });
    </script>
</body>
</html>
