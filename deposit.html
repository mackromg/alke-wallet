<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Administrar Fondos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card mx-auto shadow-sm" style="max-width: 400px;">
            <div class="card-body p-4 text-center">
                <h2 class="mb-3">Mis Fondos</h2>
                
                <p id="saldoActualTexto" class="text-muted fw-bold mb-4"></p>
                <div id="alert-container"></div>

                <form id="fondosForm">
                    <div class="mb-3 text-start">
                        <label class="form-label">Tipo de operación</label>
                        <select id="tipoOperacion" class="form-select">
                            <option value="deposito">Depositar dinero</option>
                            <option value="retiro">Retirar dinero</option>
                        </select>
                    </div>
                    <div class="mb-4 text-start">
                        <label for="monto" class="form-label">Monto</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="monto" placeholder="0" min="1" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3" id="btnAccion">Realizar depósito</button>
                </form>
                
                <a href="menu.html" class="btn btn-light w-100 border">Volver al Menú Principal</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            let saldoActual = parseInt(localStorage.getItem('saldoWallet'));
            if (isNaN(saldoActual)) {
                saldoActual = 250000; 
                localStorage.setItem('saldoWallet', saldoActual);
            }
            
            $('#saldoActualTexto').text('Tu saldo actual es: $ ' + saldoActual.toLocaleString('es-CL'));

            $('#tipoOperacion').change(function() {
                let tipo = $(this).val();
                $('#btnAccion').text(tipo === 'deposito' ? 'Realizar depósito' : 'Realizar retiro');
                $('#btnAccion').removeClass('btn-primary btn-danger').addClass(tipo === 'deposito' ? 'btn-primary' : 'btn-danger');
            });

            $('#fondosForm').submit(function(e) {
                e.preventDefault();
                let montoInput = parseInt($('#monto').val());
                let tipo = $('#tipoOperacion').val();
                
                if(isNaN(montoInput) || montoInput <= 0) {
                    $('#alert-container').html('<div class="alert alert-warning mt-3">Ingresa un monto válido.</div>');
                    return;
                }
                if(tipo === 'deposito' && montoInput > 1000000) {
                    $('#alert-container').html('<div class="alert alert-danger mt-3">El depósito máximo es $1.000.000.</div>');
                    return;
                }
                if(tipo === 'retiro' && montoInput > saldoActual) {
                    $('#alert-container').html('<div class="alert alert-danger mt-3">Saldo insuficiente para este retiro.</div>');
                    return;
                }

                // Historial de prueba
                let historial = JSON.parse(localStorage.getItem('historialTransacciones'));
                if (!historial || historial.length === 0) {
                    historial = [
                        { tipo: 'compra', detalle: 'Netflix', monto: -8500, fecha: '30/08/2026, 10:00' },
                        { tipo: 'deposito', detalle: 'Deposito en Sucursal', monto: 50000, fecha: '29/08/2026, 18:30' },
                        { tipo: 'compra', detalle: 'Supermercado Lider', monto: -45000, fecha: '28/08/2026, 14:15' }
                    ];
                }

                let fechaActual = new Date().toLocaleString('es-CL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

                if(tipo === 'deposito') {
                    saldoActual += montoInput;
                    $('#alert-container').html('<div class="alert alert-success mt-3">Depósito exitoso. Actualizando...</div>');
                    // unshift()
                    historial.unshift({ tipo: 'deposito', detalle: 'Carga de fondos', monto: montoInput, fecha: fechaActual });
                } else {
                    saldoActual -= montoInput;
                    $('#alert-container').html('<div class="alert alert-success mt-3">Retiro exitoso. Actualizando...</div>');
                    historial.unshift({ tipo: 'retiro', detalle: 'Retiro de fondos', monto: -montoInput, fecha: fechaActual });
                }

                localStorage.setItem('saldoWallet', saldoActual); 
                localStorage.setItem('historialTransacciones', JSON.stringify(historial));
                
                setTimeout(() => window.location.href = 'menu.html', 2000);
            });
        });
    </script>
</body>
</html>
